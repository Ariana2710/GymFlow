<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>GYM FLOW — Reportes</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body class="dashboard-page">
  <aside class="sidebar">
    <div class="brand">
      <img src="img/logo.jpg" alt="GYM FLOW" class="brand-logo" />
      <span>GYM FLOW</span>
    </div>

    <nav class="nav">
      <a href="dashboard.html" class="nav-item">Dashboard</a>
      <a href="clases.html" class="nav-item">Gestión de Clases</a>
      <a href="reportes.html" class="nav-item active">Reportes</a>
      <a href="login.html" class="nav-item logout" onclick="localStorage.clear()">Cerrar sesión</a>
    </nav>
  </aside>

  <div class="main">
    <header class="topbar">
      <h2>Reportes</h2>
    </header>

    <section class="content">
      <section class="panel">
        <div class="panel-header">
          <h3>Resumen Mensual</h3>
          <a class="link-btn" href="javascript:window.print()">Exportar PDF</a>
        </div>

        <div class="report-grid">
          <div class="report-card">
            <h4>Top 5 Clases</h4>
            <ol class="muted" id="listaTop">
            </ol>
          </div>

          <div class="report-card">
            <h4>Asistencia por día</h4>
            <p class="muted" id="listaDias" style="list-style: none; padding-left: 0; "></p>
          </div>

          <div class="report-card">
            <h4>Ocupación promedio</h4>
            <p class="muted"> Total clases: <strong id="totalClases"> 0 </strong> </p>
            <p class="muted"> Cupos totales: <strong id="totalCupos"> 0 </strong></p>
          </div>
        </div>
      </section>
    </section>

    <footer class="site-footer">
      <small>GYM FLOW — Reportes (estructura estática).</small>
    </footer>
  </div>
 <script>
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = 'login.html';
  }
  async function cargarReportes() {
    try {
      const res = await fetch('http://localhost:3000/api/clases');
      const clases = await res.json();
      const listaTop = document.getElementById('listaTop');
      const listaDias = document.getElementById('listaDias');
      const totalClases = document.getElementById('totalClases');
      const totalCupos = document.getElementById('totalCupos');

      if (!clases || clases.length === 0) {
        listaTop.innerHTML = '<li> No hay clases cargadas </li>';
        return;
      }

      totalClases.textContent = clases.length;
      const sumaCupos = clases.reduce((acc, c) => acc + (Number(c.cupoMaximo) || 0), 0);
      totalCupos.textContent = sumaCupos;

      listaTop.innerHTML = '';
      const ordenadas = [...clases].sort((a, b) => (b.cupoMaximo || 0) - (a.cupoMaximo || 0));
      ordenadas.slice(0, 5).forEach((c) => {
        const li = document.createElement('li');
        li.textContent = c.nombre + ' (' + (c.instructor || 'Staff') + ') - ' + (c.cupoMaximo || 0) + 'cupos';
        listaTop.appendChild(li);
      });

      const diasConteo = {};
      clases.forEach((c) => {
        const d = c.dia ? c.dia.trim() : 'Sin definir';
        diasConteo[d] = (diasConteo[d] || 0) + 1;
      });

      listaDias.innerHTML = '';
      for (const [dia, cant] of Object.entries(diasConteo)) {
        const li = document.createElement('li');
        li.textContent = dia + ': ' + cant + ' clases';
        listaDias.appendChild(li);
      }
    } catch (err) {
      console.error('Error al cargar resportes:', err);
    }
  } cargarReportes();
 </script>
</body>
</html>
